# Static example only. Replace names/certificate paths during an owner-controlled
# deployment. Contract tests inspect this file without starting nginx.
map $http_upgrade $pioneer_connection_upgrade {
    default upgrade;
    ''      close;
}

map $request_uri $pioneer_log_uri {
    ~^/pioneer/storage/views/ /pioneer/storage/views/[REDACTED];
    default                    $uri;
}

log_format pioneer_edge '$remote_addr $request_method $pioneer_log_uri $status';

server {
    listen 80;
    server_name gateway.example.invalid;
    # Never reflect an untrusted Host header into the redirect target.
    return 308 https://gateway.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name gateway.example.invalid;
    access_log logs/pioneer-edge.log pioneer_edge;

    ssl_certificate     /owner/configured/fullchain.pem;
    ssl_certificate_key /owner/configured/private-key.pem;

    client_header_buffer_size 8k;
    large_client_header_buffers 2 8k;
    # Root WebSocket handshakes and /storage reads have no HTTP request body.
    client_max_body_size 1k;

    location = /pioneer {
        return 308 /pioneer/;
    }

    # gateway_base_url = https://gateway.example.invalid/pioneer/
    # Strip only the configured public prefix. Root WSS becomes upstream `/`,
    # while `/pioneer/storage/...` becomes upstream `/storage/...`.
    location /pioneer/ {
        rewrite ^/pioneer/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pioneer_connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Pioneer-Protocol-Version $http_pioneer_protocol_version;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Cookie "";

        # The edge replaces rather than appends the client address. Gateway
        # accepts it only when this edge IP is in gateway.trusted_proxy_peers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 15s;
    }
}
